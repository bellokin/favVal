<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Favour’s Padlock</title>
<style>
:root{--ink:#fff7ef;--bg1:#2a1238;--bg2:#e8607a;--gold:#ffc857;--card:#fff7ef;--text:#3a1442;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%;background:var(--bg1);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overscroll-behavior:none}
#app{min-height:100vh;background:linear-gradient(180deg,var(--bg1) 0%,#7a2a62 60%,var(--bg2) 100%);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:420px}
h1{margin:0 0 6px;font-size:24px;line-height:1.15}
.sub{margin:0 0 12px;font-size:15px;line-height:1.4;opacity:.9}
.clue{display:flex;align-items:center;gap:10px;background:rgba(255,247,239,.1);border-radius:12px;padding:8px 10px;margin-bottom:7px}
.digs{display:flex;gap:4px;flex:none}
.digs b{width:28px;height:34px;border-radius:7px;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:20px}
.clue span{font-size:14px;line-height:1.3}
#lock{margin:14px auto 0;width:292px}
.shackle{width:112px;height:74px;border:15px solid #cfd3da;border-bottom:0;border-radius:64px 64px 0 0;margin:0 auto -3px;transition:transform .5s ease}
.open .shackle{transform:translateY(-22px);border-color:var(--gold)}
.body{background:linear-gradient(180deg,#ffd978,#e3a92f);border-radius:22px;padding:16px 12px 14px;box-shadow:0 8px 0 #a8741a}
#wheels{display:flex;justify-content:space-between;gap:8px;background:#5c3a0e;border-radius:14px;padding:8px}
.wh{flex:1;display:flex;flex-direction:column;align-items:center}
.wh button.a{width:100%;height:30px;font-size:15px;background:none;color:var(--gold);padding:0;border-radius:8px}
.win{width:100%;height:92px;background:#2a1238;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.win i{font-style:normal;font-size:20px;line-height:24px;color:rgba(255,247,239,.3)}
.win em{font-style:normal;font-size:38px;line-height:44px;font-weight:bold;color:var(--gold)}
button{font:inherit;color:#fff;border:0;cursor:pointer}
#unlock{display:block;margin:14px auto 0;font-size:18px;font-weight:bold;background:#d8325f;border-radius:999px;padding:12px 34px}
button:active{transform:scale(.96)}
#note{min-height:22px;text-align:center;margin-top:12px;font-size:15px;color:var(--gold)}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(30,10,40,.85);z-index:5;text-align:center;overflow:hidden}
.ov.show{display:flex}
.card{position:relative;z-index:2;background:var(--card);color:var(--text);border-radius:22px;padding:26px 22px;max-width:340px;width:100%}
.card h2{margin:0 0 8px;font-size:26px;line-height:1.15}
.card p{margin:0 0 16px;font-size:16px;line-height:1.45}
.big{font-size:30px;color:#d8325f;font-weight:bold;margin:0 0 14px}
.card button{background:#d8325f;font-size:18px;font-weight:bold;border-radius:999px;padding:12px 28px}
.fl{position:absolute;bottom:-40px;font-size:26px;animation:up 4s linear infinite;z-index:1}
@keyframes up{to{transform:translateY(-120vh)}}
@media (prefers-reduced-motion:reduce){.fl{animation:none;bottom:20%}.shake{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="wrap">
  <h1>Favour’s padlock 🔒</h1>
  <p class="sub">Something special is locked inside. Five clues point to one secret 4-digit code. Work it out, then turn the wheels.</p>
  <div id="clues"></div>

  <div id="lock">
    <div class="shackle"></div>
    <div class="body"><div id="wheels"></div></div>
  </div>
  <button id="unlock">Unlock</button>
  <div id="note"></div>
</div></div>

<div class="ov" id="win"><div class="card">
  <h2 id="gt">Your gift</h2>
  <p id="gn"></p>
  <div class="big">Favour Bello 💖</div>
  <button id="again">Play again</button>
</div></div>

<script>
// ====== EDIT YOUR GIFT HERE ======
var GIFT_TITLE = "You cracked it! 🎉";
var GIFT_NOTE  = "Replace this text with your real gift: a voucher, a date, a promise, anything.";
// =================================

var CODE = "7305"; // the clues below are checked to point to ONLY this code
var CL = [
  ["2934", "One number is right, but in the wrong place."],
  ["3965", "One number is right and well placed. Another is right but in the wrong place."],
  ["1397", "One number is right and well placed. Another is right but in the wrong place."],
  ["9302", "Two numbers are right and both well placed."],
  ["4892", "Nothing here is in the code."]
];
var vals = [0,0,0,0], wheels = [], locked = true;
var note = document.getElementById("note"), lockEl = document.getElementById("lock");

var cl = document.getElementById("clues");
CL.forEach(function(c){
  var d = document.createElement("div"); d.className = "clue";
  var g = document.createElement("div"); g.className = "digs";
  c[0].split("").forEach(function(n){ var b = document.createElement("b"); b.textContent = n; g.appendChild(b); });
  var s = document.createElement("span"); s.textContent = c[1];
  d.appendChild(g); d.appendChild(s); cl.appendChild(d);
});

function render(i) {
  var v = vals[i], w = wheels[i];
  w.p.textContent = (v + 9) % 10; w.c.textContent = v; w.n.textContent = (v + 1) % 10;
}
function stepWheel(i, d) { if (!locked) return; vals[i] = (vals[i] + d + 10) % 10; render(i); }

var wh = document.getElementById("wheels");
[0,1,2,3].forEach(function(i){
  var col = document.createElement("div"); col.className = "wh";
  var up = document.createElement("button"); up.className = "a"; up.textContent = "▲"; up.setAttribute("aria-label", "Up");
  var win = document.createElement("div"); win.className = "win";
  var p = document.createElement("i"), c = document.createElement("em"), n = document.createElement("i");
  win.appendChild(p); win.appendChild(c); win.appendChild(n);
  var dn = document.createElement("button"); dn.className = "a"; dn.textContent = "▼"; dn.setAttribute("aria-label", "Down");
  col.appendChild(up); col.appendChild(win); col.appendChild(dn); wh.appendChild(col);
  wheels[i] = {p:p, c:c, n:n};
  up.onclick = function(){ stepWheel(i, 1); };
  dn.onclick = function(){ stepWheel(i, -1); };

  var y0 = 0, acc = 0, on = false;
  function start(y){ on = true; y0 = y; acc = 0; }
  function mv(y){ if (!on) return; acc += y0 - y; y0 = y;
    while (acc >= 26) { stepWheel(i, 1); acc -= 26; }
    while (acc <= -26) { stepWheel(i, -1); acc += 26; } }
  win.addEventListener("touchstart", function(e){ start(e.touches[0].clientY); e.preventDefault(); }, {passive:false});
  win.addEventListener("touchmove", function(e){ mv(e.touches[0].clientY); e.preventDefault(); }, {passive:false});
  win.addEventListener("touchend", function(){ on = false; });
  win.addEventListener("mousedown", function(e){ start(e.clientY); });
  window.addEventListener("mousemove", function(e){ mv(e.clientY); });
  window.addEventListener("mouseup", function(){ on = false; });
  win.addEventListener("wheel", function(e){ stepWheel(i, e.deltaY > 0 ? 1 : -1); e.preventDefault(); }, {passive:false});
  render(i);
});

document.getElementById("unlock").onclick = function(){
  if (!locked) return;
  if (vals.join("") === CODE) {
    locked = false; lockEl.classList.add("open"); note.textContent = "Click! 🔓";
    setTimeout(openGift, 1000);
  } else {
    note.textContent = "Not quite. Check the clues again.";
    lockEl.classList.remove("shake"); void lockEl.offsetWidth; lockEl.classList.add("shake");
  }
};

function openGift() {
  document.getElementById("gt").textContent = GIFT_TITLE;
  document.getElementById("gn").textContent = GIFT_NOTE;
  var ov = document.getElementById("win");
  if (!ov.querySelector(".fl")) {
    var em = ["💖","✨","💛","🎈","🎉"];
    for (var k = 0; k < 14; k++) {
      var s = document.createElement("span"); s.className = "fl"; s.textContent = em[k % 5];
      s.style.left = (k * 7 + 2) + "%"; s.style.animationDelay = (k * .3) + "s"; ov.appendChild(s);
    }
  }
  ov.classList.add("show");
}
document.getElementById("again").onclick = function(){
  document.getElementById("win").classList.remove("show");
  locked = true; lockEl.classList.remove("open"); note.textContent = "";
  vals = [0,0,0,0]; for (var i = 0; i < 4; i++) render(i);
};
</script>
</body>
</html>
