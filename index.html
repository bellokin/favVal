<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Favour 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:      #c41e4e;
    --rose-deep: #7a0f34;
    --blush:     #ffd9e3;
    --cream:     #fff5f1;
    --gold:      #e8b24d;
    --plum:      #3a0d22;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    background: radial-gradient(circle at 20% 10%, #ffe3ea 0%, #ffb9cf 35%, var(--rose) 100%);
    color: var(--plum);
    overflow-x:hidden;
    position:relative;
  }

  /* ambient floating hearts */
  .ambient{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .ambient span{
    position:absolute;
    bottom:-40px;
    font-size: 22px;
    opacity:.35;
    animation: floatUp linear infinite;
    color: #fff;
  }
  @keyframes floatUp{
    0%   { transform: translateY(0) rotate(0deg); opacity:0; }
    10%  { opacity:.35; }
    90%  { opacity:.25; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity:0; }
  }

  .wrap{
    position:relative; z-index:1;
    max-width: 640px;
    margin: 0 auto;
    padding: 36px 18px 60px;
    text-align:center;
  }

  h1{
    font-family:'Dancing Script', cursive;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    color: #fff;
    margin: 0 0 4px;
    text-shadow: 0 2px 14px rgba(122,15,52,.45);
  }
  .subtitle{
    margin: 0 0 26px;
    font-weight:600;
    letter-spacing:.03em;
    color: var(--cream);
    opacity:.95;
  }

  .hud{
    display:flex;
    justify-content:center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .pill{
    background: rgba(255,255,255,.85);
    border-radius: 999px;
    padding: 8px 20px;
    font-weight:700;
    font-size: .95rem;
    color: var(--rose-deep);
    box-shadow: 0 4px 14px rgba(122,15,52,.18);
    min-width: 110px;
  }
  .pill b{ font-family:'Dancing Script', cursive; font-size:1.15rem; margin-left:4px; }

  /* ---- heart shaped board ---- */
  .board-frame{
    position:relative;
    width: min(92vw, 420px);
    aspect-ratio: 1/0.95;
    margin: 0 auto 22px;
  }
  .hole{
    position:absolute;
    width: 78px; height: 78px;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle at 50% 40%, #6e2438, #3a0d22 75%);
    box-shadow: inset 0 6px 10px rgba(0,0,0,.5), 0 3px 6px rgba(0,0,0,.25);
    display:flex; align-items:flex-end; justify-content:center;
    overflow:hidden;
    cursor: pointer;
  }
  .hole .pop{
    font-size: 40px;
    line-height:1;
    transform: translateY(90%);
    transition: transform .12s ease-out;
    user-select:none;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.3));
  }
  .hole.up .pop{ transform: translateY(6%); }
  .hole.hit .pop{ animation: popHit .32s ease-out forwards; }
  @keyframes popHit{
    0%{ transform: translateY(6%) scale(1); opacity:1;}
    100%{ transform: translateY(-70%) scale(1.5); opacity:0;}
  }

  /* floating score numbers */
  .float-score{
    position:absolute;
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size: 22px;
    color: var(--gold);
    pointer-events:none;
    animation: riseFade .7s ease-out forwards;
    z-index:5;
  }
  .float-score.bad{ color:#ffeaea; }
  @keyframes riseFade{
    0%{ transform: translate(-50%,-50%); opacity:1; }
    100%{ transform: translate(-50%,-160%); opacity:0; }
  }

  button{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 1.05rem;
    border:none;
    border-radius: 999px;
    padding: 14px 34px;
    cursor:pointer;
    background: linear-gradient(135deg, var(--gold), #f7d38a);
    color: var(--plum);
    box-shadow: 0 8px 18px rgba(122,15,52,.3);
    transition: transform .15s ease;
  }
  button:hover{ transform: translateY(-2px) scale(1.03); }
  button:active{ transform: translateY(0) scale(.98); }
  button:disabled{ opacity:.5; cursor:default; }

  .msg{
    color:#fff;
    font-weight:600;
    min-height: 1.4em;
    margin-bottom: 6px;
  }

  /* ---- end screen / envelope ---- */
  .end-screen{ display:none; margin-top: 10px; }
  .end-screen.show{ display:block; animation: fadeIn .5s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .final-score{
    font-family:'Dancing Script', cursive;
    font-size: 2.4rem;
    color:#fff;
    margin: 4px 0 18px;
  }

  .envelope{
    position:relative;
    width: 210px; height: 140px;
    margin: 20px auto 10px;
    cursor:pointer;
  }
  .envelope .body{
    position:absolute; inset:0;
    background: var(--cream);
    border-radius: 6px;
    box-shadow: 0 10px 24px rgba(122,15,52,.35);
  }
  .envelope .flap{
    position:absolute;
    top:0; left:0; width:100%; height:70px;
    background: var(--blush);
    clip-path: polygon(0 0, 100% 0, 50% 90%);
    transform-origin: top;
    transition: transform .6s cubic-bezier(.4,0,.2,1);
    border-radius: 6px 6px 0 0;
    z-index:2;
  }
  .envelope.open .flap{ transform: rotateX(180deg); }
  .envelope .heart-seal{
    position:absolute; top:56px; left:50%; transform:translateX(-50%);
    font-size: 26px; z-index:3; transition:opacity .3s;
  }
  .envelope.open .heart-seal{ opacity:0; }
  .envelope .hint{
    position:absolute; bottom:-30px; width:100%; text-align:center;
    font-size:.85rem; color:#fff; font-weight:600; opacity:.9;
  }

  .letter{
    max-width: 480px;
    margin: 26px auto 0;
    background: var(--cream);
    border-radius: 14px;
    padding: 30px 26px;
    box-shadow: 0 16px 40px rgba(122,15,52,.4);
    display:none;
    text-align:left;
    font-size: 1.02rem;
    line-height:1.65;
    color: var(--plum);
  }
  .letter.show{ display:block; animation: fadeIn .6s ease; }
  .letter .sign{
    font-family:'Dancing Script', cursive;
    font-size: 1.7rem;
    color: var(--rose);
    margin-top: 14px;
    text-align:right;
  }

  .replay{ margin-top: 22px; }

  /* falling confetti hearts */
  .confetti-piece{
    position:fixed;
    top:-40px;
    font-size: 18px;
    z-index:20;
    pointer-events:none;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity:.2; }
  }

  @media (max-width:380px){
    .hole{ width:60px; height:60px; }
    .hole .pop{ font-size:30px; }
  }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>

<div class="wrap">
  <h1>Happy Girlfriend's Day</h1>
  <p class="subtitle">a little game for Favour, made with love 💗</p>

  <div class="hud">
    <div class="pill">Score<b id="score">0</b></div>
    <div class="pill">Time<b id="time">45</b></div>
  </div>

  <p class="msg" id="msg">Catch the hearts, dodge the broken ones. Ready?</p>

  <div class="board-frame" id="board"></div>

  <button id="startBtn">Start the game 💘</button>

  <div class="end-screen" id="endScreen">
    <p class="msg" id="endMsg"></p>
    <div class="final-score" id="finalScore"></div>

    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="heart-seal">💌</div>
      <div class="body"></div>
      <div class="hint">tap the envelope</div>
    </div>

    <div class="letter" id="letter"></div>

    <div class="replay">
      <button id="replayBtn">Play again</button>
    </div>
  </div>
</div>

<script>
/* ---------------- ambient background hearts ---------------- */
const ambient = document.getElementById('ambient');
for(let i=0;i<14;i++){
  const s = document.createElement('span');
  s.textContent = ['💗','💕','💞','♥'][Math.floor(Math.random()*4)];
  s.style.left = Math.random()*100+'%';
  s.style.fontSize = (14+Math.random()*18)+'px';
  s.style.animationDuration = (10+Math.random()*10)+'s';
  s.style.animationDelay = (Math.random()*10)+'s';
  ambient.appendChild(s);
}

/* ---------------- heart-shaped hole layout ---------------- */
const positions = [
  [50,36],[32,18],[68,18],
  [16,32],[84,32],
  [26,52],[74,52],
  [50,64],[50,86]
];
const board = document.getElementById('board');
const holes = positions.map(([x,y])=>{
  const h = document.createElement('div');
  h.className='hole';
  h.style.left = x+'%';
  h.style.top  = y+'%';
  const pop = document.createElement('div');
  pop.className='pop';
  h.appendChild(pop);
  board.appendChild(h);
  return {el:h, pop, active:false, kind:null, timeout:null};
});

/* ---------------- game state ---------------- */
let score = 0, timeLeft = 45, timerId = null, spawnId = null, running=false;
const scoreEl = document.getElementById('score');
const timeEl  = document.getElementById('time');
const msgEl   = document.getElementById('msg');

function randHole(){
  const free = holes.filter(h=>!h.active);
  if(!free.length) return null;
  return free[Math.floor(Math.random()*free.length)];
}

function spawn(){
  if(!running) return;
  const h = randHole();
  if(h){
    const roll = Math.random();
    let kind = 'good', emoji='💗', life=850;
    if(roll < 0.14){ kind='gold'; emoji='💛'; life=700; }
    else if(roll < 0.30){ kind='bad'; emoji='💔'; life=750; }
    h.active = true; h.kind = kind;
    h.pop.textContent = emoji;
    h.el.classList.add('up');
    h.timeout = setTimeout(()=>{
      if(h.active){ retract(h); }
    }, life);
  }
  spawnId = setTimeout(spawn, 380 + Math.random()*380);
}

function retract(h){
  h.active=false;
  h.el.classList.remove('up','hit');
  clearTimeout(h.timeout);
}

function floatScore(x,y,text,bad){
  const f = document.createElement('div');
  f.className='float-score' + (bad?' bad':'');
  f.textContent = text;
  f.style.left = x+'px';
  f.style.top = y+'px';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),700);
}

holes.forEach(h=>{
  h.el.addEventListener('click', ()=>{
    if(!running || !h.active) return;
    const rect = h.el.getBoundingClientRect();
    if(h.kind==='bad'){
      score = Math.max(0, score-3);
      floatScore(rect.left+rect.width/2, rect.top, '-3', true);
    } else if(h.kind==='gold'){
      score += 5;
      floatScore(rect.left+rect.width/2, rect.top, '+5');
    } else {
      score += 1;
      floatScore(rect.left+rect.width/2, rect.top, '+1');
    }
    scoreEl.textContent = score;
    h.el.classList.add('hit');
    setTimeout(()=>retract(h), 200);
  });
});

function tick(){
  timeLeft--;
  timeEl.textContent = timeLeft;
  if(timeLeft<=0){ endGame(); }
}

function startGame(){
  score=0; timeLeft=45;
  scoreEl.textContent=0; timeEl.textContent=45;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = 'Playing...';
  msgEl.textContent = "Go, go, go!";
  running = true;
  timerId = setInterval(tick, 1000);
  spawn();
}

function endGame(){
  running = false;
  clearInterval(timerId);
  clearTimeout(spawnId);
  holes.forEach(retract);
  document.getElementById('startBtn').style.display='none';
  const endScreen = document.getElementById('endScreen');
  endScreen.classList.add('show');

  let line;
  if(score >= 40) line = "Incredible! Your heart-catching skills are as good as your real one 💖";
  else if(score >= 20) line = "Not bad at all — you clearly know how to catch a heart 😌💕";
  else line = "However the score turned out, you already caught the one that matters 😘";
  document.getElementById('endMsg').textContent = line;
  document.getElementById('finalScore').textContent = 'Final score: ' + score;
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('replayBtn').addEventListener('click', ()=>{
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('letter').classList.remove('show');
  document.getElementById('envelope').classList.remove('open');
  document.getElementById('startBtn').style.display='inline-block';
  document.getElementById('startBtn').disabled=false;
  document.getElementById('startBtn').textContent='Start the game 💘';
  msgEl.textContent = "Catch the hearts, dodge the broken ones. Ready?";
});

/* ---------------- envelope + love letter ---------------- */
const envelope = document.getElementById('envelope');
const letter = document.getElementById('letter');
envelope.addEventListener('click', ()=>{
  if(envelope.classList.contains('open')) return;
  envelope.classList.add('open');
  burstConfetti();
  setTimeout(()=>{
    letter.innerHTML =
      "My dearest Favour,<br><br>" +
      "Happy Girlfriend's Day. Out of every hole in that little heart-shaped board, " +
      "there was only ever one heart worth catching, and somehow, a while back, you let me catch it anyway.<br><br>" +
      "Every day with you feels like a bonus round I didn't know I was lucky enough to unlock. " +
      "You make ordinary days feel like high scores, and hard days feel a lot lighter to carry.<br><br>" +
      "So however many hearts you caught up there, know that down here, you already have mine. All of it. No timer, no game over.<br><br>" +
      "Thank you for being exactly who you are.<br>" +
      "<span class='sign'>Always yours 💕</span>";
    letter.classList.add('show');
    letter.scrollIntoView({behavior:'smooth', block:'center'});
  }, 500);
});

function burstConfetti(){
  const emojis = ['💗','💕','💛','✨','💖'];
  for(let i=0;i<60;i++){
    const c = document.createElement('div');
    c.className='confetti-piece';
    c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    c.style.left = Math.random()*100+'vw';
    c.style.fontSize = (14+Math.random()*16)+'px';
    c.style.animationDuration = (2.2+Math.random()*1.8)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4200);
  }
}
</script>
</body>
</html>
